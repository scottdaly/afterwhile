<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p id="wordmark" class="wordmark"></p>
      <p id="tagline" class="tagline"></p>
    </header>

    <section>
      <h2>This page</h2>
      <p id="pageTitle" class="title">Checking this computer…</p>
      <p id="pageUrl" class="url"></p>
      <p id="pageCount" class="meta"></p>
      <p id="pageCoverage" class="coverage"></p>
      <p id="pageError" class="error" hidden></p>
    </section>

    <section>
      <h2>Today</h2>
      <p id="today" class="today">0 saved</p>
    </section>

    <section class="card">
      <div class="row">
        <h2>Slack</h2>
        <button id="slackToggle" type="button" class="toggle">Turn on</button>
      </div>
      <ul id="risks"></ul>
      <label class="check"><input id="includeDms" type="checkbox" /> DMs</label>
      <label class="check"><input id="includePrivate" type="checkbox" /> Private channels</label>
      <p class="hint">DMs and private channels stay off until you turn them on here.</p>
    </section>

    <section class="actions">
      <button id="pause" type="button">Pause</button>
      <button id="forgetPage" type="button">Forget this page</button>
      <button id="forgetSite" type="button" class="danger">Forget Slack</button>
    </section>

    <footer id="helper">Helper</footer>
    <script src="popup.js"></script>
  </body>
</html>
